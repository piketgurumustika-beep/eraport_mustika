<style>
:root{--navy:#0d1f33;--navy2:#15314d;--navy3:#1d4268;--gold:#e8b931;--gold2:#f6df8a;--ruby:#b3202a;--leaf:#1f7a3f;--bg:#f5f2ea;--card:#fffdf8;--ink:#1c2733;--mut:#6b7684;--line:#e4dfd0;--ok:#1f7a3f;--warn:#c47f00;--bad:#b3202a;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
.hide{display:none!important}
/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:20px;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#1d4268 0,#0d1f33 55%,#06111d 100%);color:#fff;z-index:50}
#splash .px{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#splash .px i{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--gold2);opacity:0;animation:rise var(--d) linear infinite;animation-delay:var(--l);box-shadow:0 0 8px var(--gold)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh) translateX(var(--x));opacity:0}}
.logoWrap{position:relative;width:min(210px,44vw);aspect-ratio:1;animation:pop 1.3s cubic-bezier(.2,1.4,.4,1) both}
.logoWrap img{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));animation:float 5s ease-in-out infinite 1.3s}
.logoWrap:before{content:"";position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--gold),transparent 40%,var(--gold2),transparent 75%);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%);opacity:.9}
.logoWrap:after{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(232,185,49,.28),transparent 62%);animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.6}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.ttl{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:.22em;margin-top:10px;color:var(--gold2);text-shadow:0 0 18px rgba(232,185,49,.55),0 2px 0 #8a6500}
.ttl span{display:inline-block;opacity:0;animation:letter .6s ease forwards}
@keyframes shine{to{background-position:200% center}}
@keyframes letter{from{opacity:0;transform:translateY(18px) scale(.8)}to{opacity:1;transform:none}}
.sub{letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:#cfd9e6;text-align:center;opacity:0;animation:fadeUp 1s 1.5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.gate{width:min(380px,92vw);background:rgba(255,255,255,.07);backdrop-filter:blur(8px);border:1px solid rgba(232,185,49,.35);border-radius:16px;padding:20px;opacity:0;animation:fadeUp 1s 2s forwards;position:relative;z-index:2}
.gate label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2)}
.gate input,.gate select{width:100%;margin:6px 0 12px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;outline:none}
.gate select option{color:#111}
.gate input:focus,.gate select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,185,49,.25)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--navy2);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.15)}
.btn.gold{background:linear-gradient(135deg,#f3d15a,#d9a41c);color:#2a1d00}
.btn.sec{background:#e9e4d3;color:var(--ink)}
.btn.red{background:var(--ruby)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%;padding:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:#ffb4b4;font-size:13px;min-height:18px;margin-top:-4px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.roles{display:grid;gap:10px;margin-top:4px}
.roles button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.roles button:not(:disabled):hover{border-color:var(--gold);background:rgba(232,185,49,.18)}
.roles button:disabled{opacity:.35;cursor:not-allowed}
.roles b{display:block}.roles small{color:#c4d0de}
.roles .ic{font-size:22px;width:30px;text-align:center}
.musicBtn{position:fixed;right:14px;top:14px;z-index:60;border:1px solid rgba(232,185,49,.5);background:rgba(13,31,51,.75);color:var(--gold2);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--gold);height:4px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
.off .eq i{animation:none;height:3px}
@keyframes eq{50%{height:14px}}
/* ---------- SHELL ---------- */
#shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#dbe4ef;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
aside .brand img{width:46px;height:46px}
aside .brand b{display:block;color:#fff;font-size:15px;line-height:1.15}
aside .brand small{color:var(--gold2);font-size:11px;letter-spacing:.08em}
aside .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f93aa;margin:14px 8px 6px}
aside a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:#cdd8e5;text-decoration:none;cursor:pointer;margin-bottom:2px}
aside a:hover{background:rgba(255,255,255,.08)}
aside a.on{background:linear-gradient(90deg,rgba(232,185,49,.28),rgba(232,185,49,.06));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
aside a .i{width:20px;text-align:center}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{font-size:19px;flex:1;min-width:140px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:#efe9d6;font-size:13px;font-weight:600}
.chip.ok{background:#dcf0e2;color:var(--ok)}.chip.warn{background:#fbecc9;color:#8a5a00}.chip.bad{background:#f8dcdc;color:var(--bad)}
.who{text-align:right;font-size:13px;line-height:1.25}.who b{display:block}
.content{padding:22px;max-width:1500px}
.menuBtn{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card h3{font-size:16px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.stat small{color:var(--mut);display:block;margin-bottom:4px}
.stat b{font-size:28px;letter-spacing:-.02em}
.bar{height:9px;background:#ebe5d2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--leaf);transition:width .5s}
.bar.mid i{background:var(--warn)}.bar.low i{background:var(--bad)}
.kls{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.kls button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kls button.on{border-color:var(--navy3);box-shadow:0 0 0 2px rgba(29,66,104,.2);background:#fff}
.kls b{display:flex;justify-content:space-between;margin-bottom:6px}
table{border-collapse:collapse;width:100%}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{background:#f0ead7;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#4b5565;position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:#fbf8ee}
td.c,th.c{text-align:center}
td input[type=number]{width:84px;text-align:center}
.in,td input,td select,td textarea,.fld input,.fld select,.fld textarea,.bar2 select,.bar2 input{padding:8px 10px;border:1px solid #d6d0bd;border-radius:8px;background:#fff;outline:none}
td input[type=text],td textarea{width:100%}
.in:focus,td input:focus,td select:focus,td textarea:focus,.fld input:focus,.fld select:focus{border-color:var(--navy3);box-shadow:0 0 0 3px rgba(29,66,104,.15)}
td input.low{color:var(--bad);font-weight:700;border-color:#e3a6a6}
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar2 label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.bar2 .sp{flex:1}
.fld{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.fld label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
.fld .wide{grid-column:1/-1}
.note{background:#fff7dc;border:1px solid #efd98a;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.note.bad{background:#fbe6e6;border-color:#e8b3b3}
.mut{color:var(--mut)}
.tag{display:inline-block;background:#e8eef6;color:#244566;border-radius:6px;padding:2px 7px;font-size:12px;margin:1px 2px 1px 0}
.empty{background:#fde9e9!important}
#modalBg{position:fixed;inset:0;background:rgba(6,17,29,.55);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
#modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px}
#modal h3{margin-bottom:14px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}
.chk label{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;opacity:0;pointer-events:none;transition:.3s}
#toast.on{opacity:1}
.paper{background:#fff;box-shadow:0 4px 22px rgba(0,0,0,.18);margin:0 auto 18px;width:210mm;zoom:.85}
.paperWrap{background:#dcd6c2;border-radius:10px;padding:18px;overflow:auto}
.paper.land{width:297mm}
/* ---------- LAPORAN (layar + cetak) ---------- */
.rp{width:210mm;min-height:296mm;padding:9mm 13mm;background:#fff;color:#000;font-family:"Times New Roman",Times,serif;font-size:11pt;line-height:1.3;page-break-after:always;break-after:page}
.rp:last-child{page-break-after:auto;break-after:auto}
.rp .kop{display:flex;align-items:center;gap:10px;border-bottom:3px double #000;padding-bottom:7px;margin-bottom:8px}
.rp .kop img,.rp .kop .ph{width:22mm;height:22mm;object-fit:contain;flex:none}
.rp .ph{border:1px dashed #888;display:flex;align-items:center;justify-content:center;text-align:center;font:8pt Arial;color:#777}
.rp .kt{flex:1;text-align:center;line-height:1.25}
.rp .kt .a{font-size:11.5pt}.rp .kt .b{font-size:15pt;font-weight:bold}.rp .kt small{font-size:9pt}
.rp h2{text-align:center;font-size:13pt;margin:6px 0 8px;text-decoration:underline}
.rp .idn{display:flex;gap:12px;margin-bottom:8px}
.rp .idn table{width:50%}
.rp .idn td{border:0;padding:1px 4px;vertical-align:top}
.rp table.t{margin:5px 0 8px}
.rp table.t th,.rp table.t td{border:1px solid #000;padding:2px 6px;font-size:10pt;text-transform:none;letter-spacing:0;background:none;position:static}
.rp table.t th{background:#e9e9e9;text-align:center}
.rp h4{margin:6px 0 2px;font-size:11pt}
.rp .sg{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-top:10px;text-align:center;font-size:10.5pt}
.rp .sg .sp{height:14mm;position:relative}
.ttd{position:absolute;left:50%;transform:translateX(-50%);top:-2mm;height:24mm;pointer-events:none}
.rp .sg .mid .sp{height:19mm}
.lg .sigbox{position:relative;height:18mm}
.lg .sigbox .ttd{height:20mm;top:-1mm}
.seg{display:inline-flex;gap:4px}.seg button{border:1px solid #d6d0bd;background:#fff;border-radius:8px;padding:6px 12px;font-weight:700;min-width:44px}.seg button.on.S{background:#fbecc9;border-color:#c47f00}.seg button.on.I{background:#dbe9fb;border-color:#2a64b3}.seg button.on.A{background:#f8dcdc;border-color:#b3202a}
.rp .sg .mid{grid-column:1/-1;margin-top:4px}
.rp .box{border:1px solid #000;padding:5px 8px;min-height:13mm}
.lg{font-family:Arial,sans-serif;font-size:9pt;padding:10mm;width:297mm;min-height:208mm;background:#fff;color:#000;page-break-after:always}
.lg h3{text-align:center;font-size:13pt;margin-bottom:2px}
.lg .sb{text-align:center;margin-bottom:8px}
.lg table th,.lg table td{border:1px solid #000;padding:2px 4px;font-size:8.5pt;text-transform:none;letter-spacing:0;background:none;position:static}
.lg table th{background:#e9e9e9;text-align:center}
.lg .sig{display:flex;justify-content:space-between;margin-top:12px;text-align:center;font-size:9pt}
#printArea{display:none}
@media print{
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 body{background:#fff}
 .rp,.lg{box-shadow:none;min-height:0!important}
 .lg table tr.lowr td{color:#000}
}
@media(max-width:900px){
 #shell{grid-template-columns:1fr}
 aside{position:fixed;left:-270px;width:260px;z-index:30;transition:.25s}
 aside.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.5)}
 .menuBtn{display:inline-block}
 .content{padding:14px}
 .paper{zoom:.45}
}
</style>

const API={
 sess:null,
 init(){try{this.sess=JSON.parse(localStorage.getItem('eraport_sess')||'null')}catch(e){this.sess=null}},
 store(s){this.sess=s;try{s?localStorage.setItem('eraport_sess',JSON.stringify(s)):localStorage.removeItem('eraport_sess')}catch(e){}},
 base(){return String(CFG.SUPABASE_URL||'').replace(/\/+$/,'')},
 h(x){const h=Object.assign({apikey:CFG.SUPABASE_KEY,'Content-Type':'application/json'},x||{});if(this.sess)h.Authorization='Bearer '+this.sess.access_token;return h},
 async f(path,o,retried){
  let r;
  try{r=await fetch(this.base()+path,Object.assign({},o,{headers:this.h(o&&o.headers)}))}catch(e){throw new Error('Tidak ada koneksi internet / server tidak terjangkau')}
  if(r.status===401&&this.sess&&!retried&&await this.refresh())return this.f(path,o,true);
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description||j.error))||('Kesalahan server '+r.status));
  return j;
 },
 keep(j){this.store({access_token:j.access_token,refresh_token:j.refresh_token,uid:(j.user&&j.user.id)||(this.sess&&this.sess.uid)})},
 async refresh(){
  if(!this.sess||!this.sess.refresh_token)return false;
  try{const r=await fetch(this.base()+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CFG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:this.sess.refresh_token})});
   if(!r.ok){this.store(null);return false}this.keep(await r.json());return true}catch(e){return false}
 },
 async signUp(email,password){
  const j=await this.f('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});
  if(!j||!j.access_token)throw new Error('Pendaftaran belum bisa diselesaikan: matikan "Confirm email" di Supabase (lihat PANDUAN).');
  this.keep(j);
 },
 async signIn(email,password){
  const j=await this.f('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
  this.keep(j);
 },
 async signOut(){try{if(this.sess)await this.f('/auth/v1/logout',{method:'POST'})}catch(e){}this.store(null)},
 updatePw(password){return this.f('/auth/v1/user',{method:'PUT',body:JSON.stringify({password})})},
 get(t,qs){return this.f('/rest/v1/'+t+(qs?'?'+qs:''),{method:'GET'})},
 async all(t,qs){let out=[],off=0;for(;;){const r=await this.get(t,(qs?qs+'&':'')+'limit=1000&offset='+off);out=out.concat(r||[]);if(!r||r.length<1000)break;off+=1000}return out},
 up(t,rows,conflict){return this.f('/rest/v1/'+t+'?on_conflict='+conflict,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})},
 patch(t,qs,body){return this.f('/rest/v1/'+t+'?'+qs,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})},
 ins(t,rows){return this.f('/rest/v1/'+t,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(rows)})},
 del(t,qs){return this.f('/rest/v1/'+t+'?'+qs,{method:'DELETE',headers:{Prefer:'return=minimal'}})},
 rpc(fn,args){return this.f('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(args||{})})}
};

let DB=emptyDB();
function emptyDB(){return{set:{...DEFSET},siswa:[],guru:[],ekskul:[],profiles:[],nilai:{},ekn:{},hadir:{},catatan:{},hari:{},presensi:{}}}
const tpKey=()=>String(DB.set.tp).replace(/[^\w]+/g,'-')+'_'+DB.set.sem;
function bucket(name){const k=tpKey();DB[name][k]=DB[name][k]||{};return DB[name][k]}
async function loadStatic(){
 const [st,sis,gur,eks]=await Promise.all([API.get('settings','key=eq.app'),API.all('siswa','order=nis'),API.all('guru','order=nama'),API.all('ekskul','order=nama')]);
 DB.set=Object.assign({},DEFSET,(st&&st[0]&&st[0].value)||{});
 DB.siswa=sis;DB.guru=gur.map(g=>({...g,mapel:g.mapel||[],kelas:g.kelas||[],wali:g.wali||'',nip:g.nip||''}));DB.ekskul=eks.map(e=>({...e,siswa:e.siswa||[]}));
}
async function loadPeriod(){
 const k=tpKey(),q='tp=eq.'+encodeURIComponent(k);
 const [nl,en,hr,ct,hd_,pr]=await Promise.all([API.all('nilai',q+'&order=nis,mapel'),API.all('ekn',q+'&order=nis,ekskul'),API.all('hadir',q+'&order=nis'),API.all('catatan',q+'&order=nis'),API.get('hari',q),API.all('presensi',q+'&order=nis,tgl')]);
 const N={},E={},Hh={},C={};
 nl.forEach(r=>{(N[r.nis]=N[r.nis]||{})[r.mapel]={n:(r.n===null||r.n===undefined)?undefined:Number(r.n),d:r.d||''}});
 en.forEach(r=>{(E[r.nis]=E[r.nis]||{})[r.ekskul]={p:r.p||'',k:r.k||''}});
 hr.forEach(r=>{Hh[r.nis]={s:r.s||0,i:r.i||0,a:r.a||0}});
 ct.forEach(r=>{C[r.nis]=r.teks||''});
 const PR={};pr.forEach(r=>{(PR[r.nis]=PR[r.nis]||{})[r.tgl]=r.status});DB.presensi[k]=PR;
 DB.nilai[k]=N;DB.ekn[k]=E;DB.hadir[k]=Hh;DB.catatan[k]=C;DB.hari[k]=(hd_&&hd_[0])?hd_[0].hari:0;
}

function statKelas(k){
 const sis=siswaOf(k);
 const per=MAPEL.map(m=>{const f=sis.filter(s=>getN(s.nis,m.k)!==null).length;return{m,f,t:sis.length,p:sis.length?f/sis.length:0}});
 const tot=per.reduce((a,b)=>a+b.t,0),fil=per.reduce((a,b)=>a+b.f,0);
 return{per,p:tot?fil/tot:0,done:per.filter(x=>x.t&&x.f===x.t).length,fil,tot};
}
function rekap(k){
 const sis=siswaOf(k);
 const rows=sis.map(s=>{const ns=MAPEL.map(m=>getN(s.nis,m.k));const v=ns.filter(x=>x!==null);const j=v.reduce((a,b)=>a+b,0);return{s,ns,j,avg:v.length?j/v.length:null,cnt:v.length}});
 const sorted=[...rows].filter(r=>r.cnt).sort((a,b)=>b.j-a.j);
 rows.forEach(r=>{r.rank=r.cnt?sorted.findIndex(x=>x.j===r.j)+1:'-'});
 return rows;
}

/* =================== MUSIK (WebAudio, tanpa file) =================== */
const Music={ctx:null,on:true,timer:null,bar:0,next:0,master:null,
 mf:m=>440*Math.pow(2,(m-69)/12),
 init(){
  if(this.ctx)return;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=0;
  const d=this.ctx.createDelay(1);d.delayTime.value=.375;const fb=this.ctx.createGain();fb.gain.value=.38;
  const lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
  d.connect(fb);fb.connect(lp);lp.connect(d);
  this.bus=this.ctx.createGain();this.bus.connect(this.master);this.bus.connect(d);d.connect(this.master);
  this.master.connect(this.ctx.destination);
  this.next=this.ctx.currentTime+.1;
  this.timer=setInterval(()=>this.sched(),200);
 },
 tone(f,t,dur,type,vol,att,dest){
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(dest||this.bus);o.start(t);o.stop(t+dur+.05);
 },
 sched(){
  if(!this.ctx)return;
  const BAR=2.4,ch=[[57,60,64],[53,57,60],[55,60,64],[55,59,62]],bs=[45,41,48,43];
  const lead=[[76,0,72,74,76,79,0,77],[77,0,76,0,72,0,74,0],[79,0,76,72,74,76,0,72],[74,0,71,74,72,0,0,0]];
  while(this.next<this.ctx.currentTime+1.2){
   const t=this.next,i=this.bar%4,c=ch[i];
   c.forEach(n=>this.tone(this.mf(n),t,BAR*1.05,'triangle',.07,.5));
   this.tone(this.mf(bs[i]),t,BAR*.95,'sine',.2,.03);
   const E=BAR/8;
   for(let s=0;s<8;s++){const n=c[[0,1,2,1,2,1,2,1][s]]+12;this.tone(this.mf(n),t+s*E,.7,'triangle',.1,.01)}
   if(this.bar>=2)lead[i].forEach((n,s)=>{if(n){this.tone(this.mf(n),t+s*E,1.4,'sine',.09,.01);this.tone(this.mf(n+12),t+s*E,.6,'sine',.025,.005)}});
   this.next+=BAR;this.bar++;
  }
 },
 start(){
  if(this.started)return;this.started=true;
  this.on=localStorage.getItem('eraport_music')!=='off';
  this.init();this.apply();$('#musicBtn').classList.remove('hide');
 },
 apply(){
  if(!this.ctx)return;
  if(this.ctx.state==='suspended')this.ctx.resume();
  this.master.gain.cancelScheduledValues(0);
  this.master.gain.linearRampToValueAtTime(this.on?.55:0,this.ctx.currentTime+1.2);
  $('#musicBtn').classList.toggle('off',!this.on);$('#musicTxt').textContent=this.on?'Musik: Nyala':'Musik: Mati';
 },
 toggle(){this.on=!this.on;try{localStorage.setItem('eraport_music',this.on?'on':'off')}catch(e){}this.apply()}
};
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>Music.start(),{once:true}));

function gateMsg(h){$('#gate').innerHTML=h}
async function boot(){

  gateMsg('<div style="text-align:center">⚙️ <b>Aplikasi belum dihubungkan ke database.</b><br><span style="font-size:13px;color:#c4d0de">Isi <code>config.js</code> dengan URL dan kunci Supabase (lihat PANDUAN).</span></div>');return}

let fails=0,lockUntil=0,GLIST=[];
async function stepLogin(mode,msg){
 mode=mode||'in';
 gateMsg('<div style="text-align:center;padding:14px">Menghubungi server…</div>');
 try{GLIST=await API.rpc('daftar_guru')||[]}catch(e){gateMsg(`<div class="err" style="text-align:center">${esc(e.message)}</div><button class="btn gold full" onclick="stepLogin()">Coba lagi</button>`);return}
 const list=GLIST.filter(g=>mode==='in'?g.terdaftar:!g.terdaftar);
 const tabs=`<div style="display:flex;gap:6px;margin-bottom:14px"><button class="btn sm ${mode==='in'?'gold':'sec'}" style="flex:1" onclick="stepLogin('in')">Masuk</button><button class="btn sm ${mode==='up'?'gold':'sec'}" style="flex:1" onclick="stepLogin('up')">Daftar pertama kali</button></div>`;
 const sel=`<label>Nama guru</label><select id="gsel">${list.map(g=>`<option value="${esc(g.id)}">${esc(g.nama)}</option>`).join('')||'<option value="">(tidak ada)</option>'}</select>`;
 if(mode==='in'){
  gateMsg(tabs+sel+`<label>Kata sandi</label><input id="pw" type="password" autocomplete="current-password" placeholder="Kata sandi pribadi Anda"><div class="err" id="perr">${esc(msg||'')}</div><button class="btn gold full" id="pgo">Masuk</button>
  <div style="text-align:center;margin-top:10px;font-size:12px;color:#9fb0c3">Belum punya akun? Pilih “Daftar pertama kali”. Lupa kata sandi? Hubungi pengembang.</div>`);
  const go=async()=>{
   if(Date.now()<lockUntil){$('#perr').textContent='Terlalu banyak percobaan. Tunggu '+Math.ceil((lockUntil-Date.now())/1000)+' detik.';return}
   const id=$('#gsel').value,pw=$('#pw').value;if(!id||!pw){$('#perr').textContent='Pilih nama dan isi kata sandi.';return}
   $('#pgo').disabled=true;$('#pgo').textContent='Memeriksa…';
   try{await API.signIn(emailOf(id),pw);await afterAuth()}
   catch(e){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}$('#gate').classList.remove('shake');void $('#gate').offsetWidth;$('#gate').classList.add('shake');
    const m=/invalid login/i.test(e.message)?'Kata sandi salah.':e.message;stepLogin('in',m)}
  };
  $('#pgo').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
 }else{
  gateMsg(tabs+sel+`<label>Kode pendaftaran (dari pengembang)</label><input id="kode" type="password" autocomplete="off">
  <label>Buat kata sandi pribadi (min. 6 karakter)</label><input id="pw1" type="password" autocomplete="new-password">
  <label>Ulangi kata sandi</label><input id="pw2" type="password" autocomplete="new-password"><div class="err" id="perr">${esc(msg||'')}</div><button class="btn gold full" id="pgo">Daftar & Masuk</button>`);
  const go=async()=>{
   const id=$('#gsel').value,kode=$('#kode').value,a=$('#pw1').value,b=$('#pw2').value,er=$('#perr');
   if(!id){er.textContent='Semua nama sudah terdaftar.';return}
   if(a.length<6){er.textContent='Kata sandi minimal 6 karakter.';return}if(a!==b){er.textContent='Kata sandi tidak sama.';return}
   $('#pgo').disabled=true;$('#pgo').textContent='Mendaftarkan…';
   try{
    if(!(await API.rpc('cek_kode',{p_code:kode})))throw new Error('Kode pendaftaran salah.');
    try{await API.signUp(emailOf(id),a)}catch(e){if(/already|registered|exist/i.test(e.message))await API.signIn(emailOf(id),a);else throw e}
    await API.rpc('claim_guru',{p_guru:id,p_code:kode});
    await afterAuth();
   }catch(e){stepLogin('up',e.message)}
  };
  $('#pgo').onclick=go;$('#pw2').onkeydown=e=>{if(e.key==='Enter')go()};
 }
}

}

const XL={

  const te=new TextEncoder(),parts=[],cd=[];let off=0;

   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,33,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
   parts.push(new Uint8Array(h.buffer),nm,d);
   const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,33,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
   cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length;
  });
  let cs=0;cd.forEach(x=>cs+=x.length);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

async function siswaDel(nis){const s=DB.siswa.find(x=>x.nis===nis);if(!confirm('Hapus siswa '+s.nama+'? Seluruh nilainya juga akan dihapus dari server.'))return;
 const q='nis=eq.'+encodeURIComponent(nis);
 try{await track(Promise.all([API.del('nilai',q),API.del('hadir',q),API.del('catatan',q),API.del('ekn',q)]));await track(API.del('siswa',q))}catch(e){return}

async function siswaImportGo(){
 let bad=0;const rows=[];
 $('#imp').value.split(/\r?\n/).forEach(line=>{
  const c=line.split('\t').map(x=>x.trim());if(c.length<4||!c[0]){if(line.trim())bad++;return}
  let k=c[3].toUpperCase().replace(/[\s\-]/g,'').replace('VIII','8').replace('VII','7').replace('IX','9');
  if(!KELAS.includes(k)){bad++;return}
  rows.push({nis:c[0],nisn:c[1]||'',nama:c[2],kelas:k,jk:(c[4]||'L').toUpperCase().startsWith('P')?'P':'L'});
 });
 try{for(let i=0;i<rows.length;i+=200)await track(API.up('siswa',rows.slice(i,i+200),'nis'))}catch(e){return}
 rows.forEach(r=>{const i=DB.siswa.findIndex(x=>x.nis===r.nis);if(i>=0)DB.siswa[i]=r;else DB.siswa.push(r)});
 addLog(`Impor siswa: ${rows.length} baris`);closeModal();toast(`${rows.length} siswa disimpan, ${bad} dilewati`);vMSiswa();
}

}
async function guruDel(id){const g=guruBy(id);if(!confirm('Hapus guru '+g.nama+'? Akun login guru ini juga ikut tidak berlaku.'))return;
 try{await track(API.patch('ekskul','pembina=eq.'+encodeURIComponent(id),{pembina:''}));await track(API.rpc('reset_akun_guru',{p_guru:id}));await track(API.del('guru','id=eq.'+encodeURIComponent(id)))}catch(e){return}
 DB.guru=DB.guru.filter(x=>x.id!==id);DB.ekskul.forEach(e=>{if(e.pembina===id)e.pembina=''});DB.profiles=await API.all('profiles');addLog('Hapus guru '+g.nama);vMGuru()}
/* =================== MASTER: EKSKUL =================== */
function vMEkskul(){
 $('#main').innerHTML=`<div class="bar2"><div class="sp"></div><button class="btn gold" onclick="ekForm()">+ Tambah ekskul</button></div>
 <div class="tw"><table><thead><tr><th>Ekstrakurikuler</th><th>Pembina</th><th class="c">Jumlah siswa</th><th></th></tr></thead><tbody>
 ${DB.ekskul.map(e=>`<tr><td><b>${esc(e.nama)}</b></td><td>${esc((guruBy(e.pembina)||{}).nama||'— belum ditunjuk —')}</td><td class="c">${e.siswa.length}</td><td style="white-space:nowrap"><button class="btn sm sec" onclick="ekForm('${e.id}')">Ubah</button> <button class="btn sm red" onclick="ekDelAll('${e.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`;
}
function ekForm(id){
 const e=id?DB.ekskul.find(x=>x.id===id):{nama:'',pembina:''};
 modal(`<h3>${id?'Ubah':'Tambah'} Ekstrakurikuler</h3><div class="fld"><label>Nama kegiatan<input id="e_n" value="${esc(e.nama)}"></label><label>Pembina<select id="e_p"><option value="">— pilih guru —</option>${opt(DB.guru,e.pembina,g=>[g.id,g.nama])}</select></label></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn gold" onclick="ekSave('${id||''}')">Simpan</button></div>`);
}
async function ekSave(id){const n=$('#e_n').value.trim(),p=$('#e_p').value;if(!n){toast('Nama wajib diisi');return}
 const row=id?{id,nama:n,pembina:p}:{id:'e'+Date.now(),nama:n,pembina:p};
 try{await track(API.up('ekskul',[row],'id'))}catch(e){return}
 if(id){const e=DB.ekskul.find(x=>x.id===id);e.nama=n;e.pembina=p}else DB.ekskul.push({...row,siswa:[]});
 addLog('Simpan ekskul '+n);closeModal();vMEkskul()}
async function ekDelAll(id){const e=DB.ekskul.find(x=>x.id===id);if(!confirm('Hapus ekskul '+e.nama+'?'))return;
 try{await track(API.del('ekn','ekskul=eq.'+encodeURIComponent(id)));await track(API.del('ekskul','id=eq.'+encodeURIComponent(id)))}catch(x){return}
 DB.ekskul=DB.ekskul.filter(x=>x.id!==id);vMEkskul()}
/* =================== PENGATURAN =================== */
function vMSet(){
 const s=DB.set;
 $('#main').innerHTML=`<div class="card"><h3>Tahun Pelajaran & Semester</h3><div class="fld"><label>Tahun Pelajaran<input id="s_tp" value="${esc(s.tp)}" placeholder="2026/2027"></label><label>Semester<select id="s_sem"><option ${s.sem==='Ganjil'?'selected':''}>Ganjil</option><option ${s.sem==='Genap'?'selected':''}>Genap</option></select></label><label>Batas ketuntasan (KKM)<input id="s_kkm" type="number" value="${s.kkm}"></label></div>
 <p class="mut">Pengaturan ini berlaku untuk <b>seluruh guru</b>. Mengganti tahun pelajaran atau semester membuka lembar data baru; data periode sebelumnya tetap tersimpan di server.</p></div>
 <div class="card"><h3>Identitas sekolah & penandatangan raport</h3><div class="fld"><label>Nama Kepala Sekolah<input id="s_ks" value="${esc(s.kepsek)}"></label><label>NIP Kepala Sekolah<input id="s_nip" value="${esc(s.kepsekNip)}"></label><label>Tempat titimangsa<input id="s_kota" value="${esc(s.kota)}"></label><label>Tanggal titimangsa (kosong = hari ini)<input id="s_tgl" type="date" value="${esc(s.tgl)}"></label><label>NPSN<input id="s_npsn" value="${esc(s.npsn)}"></label><label>Alamat sekolah (kop)<input id="s_alamat" value="${esc(s.alamat)}"></label></div>
 <div style="margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div class="chip">Logo Dinas Pendidikan KBB</div><img src="${s.dinas||LOGO_DINAS}" style="height:56px"><label class="btn sm sec" style="display:inline-block">Ganti logo<input type="file" accept="image/*" class="hide" onchange="dinasUp(this)"></label>${s.dinas?'<button class="btn sm sec" onclick="DB.set.dinas=\'\';setSave(true)">Pakai logo bawaan</button>':''}</div></div>
 <div class="card"><h3>Tanda tangan & stempel Kepala Sekolah</h3><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;min-width:150px;text-align:center">${ttdSrc()?`<img src="${ttdSrc()}" style="height:70px">`:'<span class="mut">tanpa gambar</span>'}</div><label class="btn sm sec" style="display:inline-block">Unggah gambar baru<input type="file" accept="image/png" class="hide" onchange="ttdUp(this)"></label><button class="btn sm sec" onclick="DB.set.ttd='';setSave(true)">Pakai bawaan</button><button class="btn sm sec" onclick="DB.set.ttd='none';setSave(true)">Tanpa gambar</button></div><p class="mut">Gunakan PNG berlatar transparan agar tanda tangan dan stempel tampak rapi di raport & leger.</p></div>
 <div style="margin-bottom:18px"><button class="btn gold" onclick="setSave()">💾 Simpan pengaturan</button></div>
 <div class="card"><h3>Kode & kata sandi pengembang</h3><p class="mut">Kode pendaftaran dipakai guru saat mendaftar akun pertama kali. Kata sandi pengembang dipakai untuk membuka menu ini. Keduanya disimpan terenkripsi di server.</p>
 <div class="fld"><label>Kode pendaftaran guru (baru)<input id="p1" type="password" autocomplete="new-password"></label><label>Ulangi<input id="p2" type="password" autocomplete="new-password"></label></div><div style="margin:12px 0 18px"><button class="btn" onclick="passSave('gate','p1','p2')">Ganti kode pendaftaran</button></div>
 <div class="fld"><label>Kata sandi pengembang (baru)<input id="q1" type="password" autocomplete="new-password"></label><label>Ulangi<input id="q2" type="password" autocomplete="new-password"></label></div><div style="margin-top:12px"><button class="btn red" onclick="passSave('admin','q1','q2')">Ganti sandi pengembang</button></div></div>
 <div class="card"><h3>Cadangan data</h3><p class="mut">Data tersimpan otomatis di server. Unduh cadangan berkala sebagai arsip sekolah (periode yang sedang aktif).</p><button class="btn gold" onclick="backup()">⬇️ Unduh cadangan (.json)</button></div>`;
}
async function setSave(silent){const s=DB.set;
 if(!silent){const old=tpKey();s.tp=$('#s_tp').value.trim()||s.tp;s.sem=$('#s_sem').value;s.kkm=+$('#s_kkm').value||75;s.kepsek=$('#s_ks').value.trim();s.kepsekNip=$('#s_nip').value.trim();s.kota=$('#s_kota').value.trim();s.tgl=$('#s_tgl').value;s.npsn=$('#s_npsn').value.trim();s.alamat=$('#s_alamat').value.trim();}
 try{await track(API.up('settings',[{key:'app',value:s}],'key'));await loadPeriod()}catch(e){return}
 addLog('Ubah pengaturan');toast('Pengaturan disimpan');renderShell();vMSet()}
function dinasUp(el){
 const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(1,300/Math.max(im.width,im.height));c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);DB.set.dinas=c.toDataURL('image/png');setSave(true)};im.src=r.result};r.readAsDataURL(f);
}
async function passSave(key,i1,i2){const a=$('#'+i1).value,b=$('#'+i2).value;if(a.length<6){toast('Minimal 6 karakter');return}if(a!==b){toast('Tidak sama');return}
 try{await track(API.rpc('set_secret',{p_key:key,p_new:a}));addLog('Ganti '+(key==='gate'?'kode pendaftaran':'sandi pengembang'));toast('Berhasil diganti');$('#'+i1).value=$('#'+i2).value=''}catch(e){}}
async function backup(){try{const q='tp=eq.'+encodeURIComponent(tpKey());
 const d={dibuat:new Date().toISOString(),periode:tpKey(),pengaturan:DB.set,siswa:DB.siswa,guru:DB.guru,ekskul:DB.ekskul,nilai:await API.all('nilai',q),ekn:await API.all('ekn',q),hadir:await API.all('hadir',q),catatan:await API.all('catatan',q)};
 dl(`Cadangan_Eraport_${tpKey()}_${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify(d)],{type:'application/json'}));addLog('Unduh cadangan')}catch(e){toast('Gagal: '+e.message)}}

async function vMLog(){
 $('#main').innerHTML='<p class="mut">Memuat log…</p>';
 let L=[];try{L=await API.get('logs','select=*&order=t.desc&limit=300')||[]}catch(e){$('#main').innerHTML='<div class="note bad">'+esc(e.message)+'</div>';return}
 $('#main').innerHTML=`<div class="note">Log mencatat siapa yang masuk, dengan peran apa, kapan, dan perubahan data utama (300 terbaru). Hanya pengembang yang dapat melihat halaman ini.</div><div class="tw" style="max-height:70vh"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Peran</th><th>Aktivitas</th></tr></thead><tbody>${L.map(l=>`<tr><td style="white-space:nowrap">${new Date(l.t).toLocaleString('id-ID')}</td><td>${esc(l.nama)}</td><td>${esc(l.peran)}</td><td>${esc(l.aksi)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Belum ada aktivitas.</td></tr>'}</tbody></table></div>`;
}
/* =================== PRESENSI HARIAN =================== */
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const presOf=nis=>(DB.presensi[tpKey()]||{})[nis]||{};
function presCount(nis){const c={s:0,i:0,a:0};Object.values(presOf(nis)).forEach(v=>{if(v==='S')c.s++;else if(v==='I')c.i++;else if(v==='A')c.a++});return c}
function vPres(){
 const kls=kelasChoices();if(!kls.includes(S.ui.kelas))S.ui.kelas=kls[0];
 if(!S.ui.pd)S.ui.pd=todayISO();const d=S.ui.pd;
 const sis=siswaOf(S.ui.kelas);
 const dt=new Date(d+'T00:00:00');const hr=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][dt.getDay()];
 const nS=sis.filter(x=>presOf(x.nis)[d]==='S').length,nI=sis.filter(x=>presOf(x.nis)[d]==='I').length,nA=sis.filter(x=>presOf(x.nis)[d]==='A').length;
 $('#main').innerHTML=`<div class="bar2">${kelasSel('pk',S.ui.kelas,'setPK',kls)}
  <label>Tanggal<input type="date" value="${d}" onchange="S.ui.pd=this.value||todayISO();vPres()"></label>
  <button class="btn sm sec" onclick="S.ui.pd=todayISO();vPres()">Hari ini</button><div class="sp"></div>
  <span class="chip ok">Hadir ${sis.length-nS-nI-nA}</span><span class="chip warn">Sakit ${nS}</span><span class="chip">Izin ${nI}</span><span class="chip bad">Alpa ${nA}</span></div>
 <div class="note">📋 <b>${hr}, ${tglIndo(d)}</b> — semua siswa dianggap <b>hadir</b>. Tekan <b>S</b> (sakit), <b>I</b> (izin), atau <b>A</b> (alpa) hanya untuk siswa yang tidak masuk; tekan lagi untuk membatalkan. Rekap semester otomatis masuk ke raport.</div>
 <div class="tw"><table><thead><tr><th class="c" style="width:44px">No</th><th>Nama siswa</th><th class="c">Status hari ini</th><th class="c">Total S</th><th class="c">Total I</th><th class="c">Total A</th></tr></thead><tbody>
 ${sis.map((x,i)=>{const st=presOf(x.nis)[d]||'';const c=presCount(x.nis);return`<tr><td class="c">${i+1}</td><td>${esc(x.nama)}</td><td class="c"><span class="seg">${['S','I','A'].map(k=>`<button class="${k} ${st===k?'on':''}" onclick="setPres('${x.nis}','${d}','${k}')">${k}</button>`).join('')}</span></td><td class="c">${c.s}</td><td class="c">${c.i}</td><td class="c">${c.a}</td></tr>`}).join('')}</tbody></table></div>`;
}
function setPK(v){S.ui.kelas=v;vPres()}
function setPres(nis,tgl,st){
 const P=DB.presensi[tpKey()]=DB.presensi[tpKey()]||{};P[nis]=P[nis]||{};
 const q='tp=eq.'+encodeURIComponent(tpKey())+'&nis=eq.'+encodeURIComponent(nis)+'&tgl=eq.'+tgl;
 if(P[nis][tgl]===st){delete P[nis][tgl];W(API.del('presensi',q))}
 else{P[nis][tgl]=st;W(API.up('presensi',[{tp:tpKey(),nis,tgl,status:st}],'tp,nis,tgl'))}
 const c=presCount(nis);const b=bucket('hadir');b[nis]={s:c.s,i:c.i,a:c.a};
 W(API.up('hadir',[{tp:tpKey(),nis,s:c.s,i:c.i,a:c.a}],'tp,nis'));
 const y=window.scrollY;vPres();window.scrollTo(0,y);
}
function ttdUp(el){
 const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(1,500/Math.max(im.width,im.height));c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);DB.set.ttd=c.toDataURL('image/png');setSave(true)};im.src=r.result};r.readAsDataURL(f);
}

setInterval(async()=>{
 if(!S.sess||document.hidden||pending)return;const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
 try{await loadPeriod();if(['dash','leger','raport','ekkelas'].includes(S.page)){const y=window.scrollY;view();window.scrollTo(0,y)}}catch(e){}
},45000);
buildSplash();
</script>
</body>
</html>
